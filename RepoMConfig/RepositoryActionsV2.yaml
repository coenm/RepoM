# Open in visual studio has 2 flavors
# 1. when only one sln file was found in the repo;
- type: command@1
  name: 📝 Open in Visual Studio
  command: '"{{ exe_vs2026 }}" "{{ solution_file }}"'
  active: (menu_items?.vs ?? true) && (array.size(solution_files) == 1)

# 2. otherwise (with submenu)
- type: folder@1
  name: 📝 Open in Visual Studio
  active: (menu_items?.vs ?? true) && (array.size(solution_files) > 1)
  actions:
  - type: foreach@1
    enumerable: solution_files
    variable: sln
    actions:
    - type: command@1
      name: '{{ get_filename(sln) }}'
      command: '"{{ exe_vs2026 }}" "{{ sln }}"'
  
- type: executable@1
  name: 📝 Open in Visual Studio Code
  executable: '{{ exe_vs_code }}'
  arguments: '"{{ repository.linux_path }}"'
  active: menu_items?.vsc ?? true

- type: executable@1
  name: 📊 Open in Sourcetree
  # executable: '{{ env.LocalAppData }}/SourceTree/SourceTree.exe'
  executable: 'C:/Program Files (x86)/Atlassian/Sourcetree Enterprise/SourceTree.exe'
  arguments: -f "{{ repository.windows_path }}"
  active: menu_items?.source_tree ?? true

- type: executable@1
  name: 🔍 Open in Everything
  executable: '{{ env.ProgramW6432 }}/Everything/Everything.exe'
  arguments: -s """"{{ repository.path }}\""" "
  active: menu_items?.everything ?? true

- type: executable@1
  name: 📂 Open in TotalCommander
  executable: '{{ env.ProgramW6432 }}/totalcmd/TOTALCMD64.EXE'
  arguments: /O /T /L="{{ repository.linux_path }}"
  active: menu_items?.total_commander ?? true

