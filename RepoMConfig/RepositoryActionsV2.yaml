- type: separator@1

- type: browse-repository@1
  active: menu_items?.browse_repository ?? true

- type: folder@1
  name: 📦 Git
  is-deferred: true
  active: 'and(repository.is_bare == false, (menu_items?.vs ?? true))' #workaround for && issue
  actions:
  - type: git-fetch@1
  - type: git-pull@1
  - type: git-push@1
  - type: git-checkout@1

- type: separator@1

- type: folder@1
  name: '-- RepoM --'
  is-deferred: true
  actions:
  # - type: clipboard-copy@1
  #   name: Copy current branch name
  #   text: '{{ repository.branch }}'

  # - type: clipboard-copy@1
  #   name: Copy command 'git checkout -b {{ repository.branch | string.truncate 15 "..." }}'
  #   text: '{{ repository.branch }}'
  #   active: 'repository.branch | string.starts_with "feature/"'

  - type: command@1
    name: 'Create Directory {{ repo_docs_directory }}'
    command: cmd
    arguments: /k mkdir "{{ repo_docs_directory }}"
    # arguments: /k mkdir "{{ CustomRepomDirectory }}" & copy "{{ repo_environment_template_file }}" "{{ repo_environment_file }}"
    active: '!file.dir_exists(repo_docs_directory)'

  # - type: just-text@1
  #   name: 'Usage counter: {{ statistics.count }}'
  #   active: true
  - type: command@1
    name: 'Open folder in Windows File Explorer'
    command: '"{{ repo_environment_file_directory }}"'
    active: is_bdo_nl_repository
  - type: command@1
    name: Edit repo specific env file
    command: '{{ repo_environment_file }}'
    active: 'file.file_exists(repo_environment_file)'
  - type: command@1
    name: 'Create repo specific env file'
    command: cmd
    arguments: /k mkdir "{{ repo_environment_file_directory }}" & copy "{{ repo_environment_template_file }}" "{{ repo_environment_file }}"
    active: '!file.file_exists(repo_environment_file) && file.file_exists(repo_environment_template_file)'

  # Runsettigs
  - type: folder@1
    name: Runsettings 
    active: is_bdo_tis_repository
    is-deferred: true
    context:
    - type: evaluate-variable@1
      name: runsettings_template_file_exists
      value: file.file_exists(runsettings_template_file)
    actions:
    - type: foreach@1
      enumerable: runsettings_environments
      variable: environment
      iteration-context:
      - type: render-variable@1
        name: runsettings_file
        value: '{{ repo_environment_file_directory }}\{{ environment.filename }}'
      - type: evaluate-variable@1
        name: runsettings_file_exists
        value: 'file.file_exists(repo_environment_file_directory + "\\" + environment.filename)'
      actions:
      - type: command@1
        name: Edit {{ environment.name }}
        command: '{{ runsettings_file }}'
        active: runsettings_file_exists
      - type: command@1
        name: Create {{ environment.name }}
        command: cmd
        arguments: /k mkdir "{{ runsettings_file_directory }}" & copy "{{ runsettings_template_file }}" "{{ runsettings_file }}" & "{{ runsettings_file }}" & exit
        active: '!runsettings_file_exists && runsettings_template_file_exists'
    - type: foreach@1
      enumerable: runsettings_environments
      variable: environment
      iteration-context:
      - type: render-variable@1
        name: runsettings_file
        value: '{{ repo_environment_file_directory }}\{{ environment.filename }}'
      - type: evaluate-variable@1
        name: runsettings_file_exists
        value: 'file.file_exists(repo_environment_file_directory + "\\" + environment.filename)'
      actions:
      - type: clipboard-copy@1
        name: Copy path {{ environment.name }} to clipboard {{ runsettings_file }}
        text: '{{ runsettings_file }}'
        active: runsettings_file_exists 

  # - type: separator@1
  # - type: pin-repository@1
  #   name: '📌 {{ if repository.pinned }}Unpin{{ else }}Pin{{ end }} repository'
  #   mode: toggle

  - type: ignore-repository@1
    name: ❌ Ignore repository

