context:
- type: evaluate-script@1
  content: |-

    func and(a, b)
      if ( a == false )
        ret false;
      else if ( b == false )
        ret false;
      else
        ret true
      end
    end

    func get_filename(path)
      ret path | string.split("\\") | array.last
    end
    
    func remotes_contain_inner(remotes, url_part)
      urls = remotes | array.map "url"
      filtered = array.filter(urls, do 
        ret string.contains($0, url_part) 
      end)
      ret array.size(filtered) > 0;
    end

    func remotes_contain(url_part)
      ret remotes_contain_inner(repository.remotes, url_part)
    end

    func get_remote_origin()
      remotes = repository.remotes;
      filtered = array.filter(remotes, do 
        remote = $0;
        ret remote.key == "origin"
      end)
      ret array.first(filtered);
    end

    func get_remote_origin_name()
      remote = get_remote_origin();
      ret remote?.name;
    end

    func repository_path_contains(path)
      ret repository.linux_path | string.contains path
    end

    func is_feature_branch()
      ret repository.branch | string.starts_with "feature/"
    end

    func is_develop_branch()
      ret (env.GIT_COMPLETE_FEATURE_TO_BRANCH ?? "develop") == repository.branch
    end

    func sanitize_feature_branch_name()
      ret repository.branch | string.replace "feature/" "" | string.replace "hotfix/" "" | string.strip
    end

    azure_items = []

    remote_name_origin = get_remote_origin_name();

    is_repom_repository = remotes_contain("RepoM");
    is_bdo_nl_repository = remotes_contain("tfs-bdonl");
    is_bdo_tis_repository = is_bdo_nl_repository && file.file_exists(repository.linux_path + "/.azuredevops/Pipelines/gated.yml")
    # is_bdo_ds_respository = is_bdo_nl_repository && repository_path_contains("Projects/Bdo/ds/")
    is_bdo_ds_respository = repository_path_contains("/dev/bdo/dsai/")
    is_github_repository = remotes_contain("github.com");

    is_integration_test_framework = remotes_contain("IntegrationServices.IntegrationTestFramework");
    is_end_to_end_api_test_framework = remotes_contain("EndToEndApiTestFramework");

    sln_files = file.find_files(repository.linux_path, "*.sln");
    slnx_files = file.find_files(repository.linux_path, "*.slnx");
    solution_files = array.concat(sln_files, slnx_files);
    solution_file = array.first(solution_files);
   
    # exe_vs_code = env.LocalAppData + "/Programs/Microsoft VS Code/code.exe";
    exe_vs_code = "C:/Program Files/Microsoft VS Code/code.exe";
    
    # exe_heidi_sql = "C:/StandAloneProgramFiles/HeidiSQL_12.3_64_Portable/heidisql.exe";
    exe_ssms = "C:/Program Files (x86)/Microsoft SQL Server Management Studio 18/Common7/IDE/Ssms.exe";
    exe_monitoring = "C:/Projects/Private/git/SimpleTestRunner/src/TestRunner.Application/bin/Release/net6.0-windows/TestRunner.Application.exe"
    exe_vs2026 = "C:/Program Files/Microsoft Visual Studio/18/Enterprise/Common7/IDE/devenv.exe";

    # path_bdo_repo_root = `C:\Projects\Bdo\git\`;

     
    # path_repo_repom_config
    # path_repo_docs = 'C:/Users/Munckhof CJJ/OneDrive - BDO/Data Science Repositories/Docs/';

    # to remove:
    repo_environment_file_directory = env.REPOZ_CONFIG_PATH + `\` + remote_name_origin;
    repo_environment_file = repo_environment_file_directory + `\RepoM.env`;
    repo_yaml_file = repo_environment_file_directory + `\RepoMV2.yaml`;
    repo_environment_template_file = env.REPOZ_CONFIG_PATH + `\RepoM.Template.env`;

    runsettings_file_directory = env.REPOZ_CONFIG_PATH + `\` + remote_name_origin;
    runsettings_file = runsettings_file_directory + `\local.runsettings`;
    runsettings_template_file = env.REPOZ_CONFIG_PATH + `\Runsettings.Template.runsettings`;

    path_repo_set = true;
    repo_environment_file_yaml = 'x' # dummy value

    if is_bdo_ds_respository
      repo_docs_directory = `C:\Users\Munckhof CJJ\OneDrive - BDO\Data Science Repositories\Docs\` + remote_name_origin;
      repo_environment_file_directory_base = `C:\Users\Munckhof CJJ\OneDrive - BDO\Documenten\_DATA\RepoM config`;
      repo_environment_file_directory = repo_environment_file_directory_base + `\` + remote_name_origin;
      repo_environment_file = repo_environment_file_directory + `\RepoM.env`;
      repo_environment_file_yaml = repo_environment_file_directory + `\RepoM.yaml`;
      repo_environment_template_file = `C:\Users\Munckhof CJJ\OneDrive - BDO\Data Science Repositories\Configs\RepoM.Template.env`;
      url_devops = "https://dev.azure.com/tfs-bdonl/Datascience%20and%20AI%20Fusion%20Teams/";
      powershell_files = file.find_files(repository.linux_path, "*.ps1");
    else if is_bdo_tis_repository
      repo_docs_directory = `C:\Users\Munckhof CJJ\OneDrive - BDO\BDO\RepoDocs\` + remote_name_origin;
      repo_environment_file_directory_base = env.REPOZ_CONFIG_PATH;
      repo_environment_file_directory = repo_environment_file_directory_base + `\` + remote_name_origin;
      repo_environment_file = repo_environment_file_directory + `\RepoM.env`;
      repo_environment_template_file = env.REPOZ_CONFIG_PATH + `\RepoM.Template.env`;
      url_devops = "https://dev.azure.com/tfs-bdonl/BDO-NL/";
      powershell_files = [];
    else if is_github_repository
      repo_docs_directory = `G:\My Drive\RepoDocs\github.com\` + remote_name_origin;
      url_devops = "";
      powershell_files = [];
    else
      path_repo_set = false;
      repo_environment_file_directory_base = "";
