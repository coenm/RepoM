    #     delete-source-branch: true
    #     transition-work-items: true
    #   active: is_feature_branch()

    - type: azure-devops-create-pr@2
      project-id: "{{ project_id }}"
      name: Create feature to main ({{ branch_name | string.truncate 20 ".." }})
      pr-title: '{{ branch_name }}' 
      to-branch: main
      reviewer-ids:
      - "{{ devops_guid_pr }}"
      draft-pr: true
      include-work-items: true
      open-in-browser: true
      auto-complete:
        merge-strategy: Squash
        delete-source-branch: true
        transition-work-items: true
      active: is_feature_branch()

    # - type: azure-devops-create-pr@2
    #   project-id: "{{ project_id }}"
    #   name: Create feature to master ({{ branch_name | string.truncate 20 ".." }})
    #   pr-title: '{{ branch_name }}' 
    #   to-branch: master
    #   reviewer-ids:
    #   - "{{ devops_guid_sjoerd }}"
    #   draft-pr: true
    #   include-work-items: true
    #   open-in-browser: true
    #   auto-complete:
    #     merge-strategy: Squash
    #     delete-source-branch: true
    #     transition-work-items: true
    #   active: is_feature_branch()

    - type: separator@1
    
    - type: browser@1
      active: array.size(prs) == 0
      name: Browse
      url: '{{ url_devops }}_git/{{ env.DEVOPS_GIT_REPO_NAME }}/pullrequests?_a=active'
      profile: BDO

    - type: foreach@1
      active: array.size(prs) > 0
      enumerable: prs
      variable: pr
      actions:
      - type: browser@1
        name: '{{ pr.name | string.truncate 40 "..." }}'
        url: '{{ pr.url }}'
        profile: BDO

  - type: browser@1
    name: Wiki
    url: '{{ env.WIKI_URL_PREFIX ?? url_devops }}_wiki/wikis/{{ env.WIKI_URL_SUFFIX }}'
    active: '!string.empty(env.WIKI_URL_SUFFIX)'
    profile: BDO

- type: folder@1
  name: '{{ if string.contains(env.URL_SERVICE, ".svc") }}Wcf Service{{ else }}Swagger{{ end }}'
  active: is_bdo_nl_repository && !string.empty(env.URL_SERVICE) && !applications
  is-deferred: true
  actions:
  - type: foreach@1
    enumerable: devops_environments
    variable: environment
    actions:
    - type: browser@1
      name: '{{ environment.name }}'
      url: '{{ string.replace(env.URL_SERVICE, ".bdo.nl", environment.url) }}'
      profile: BDO
  
- type: folder@1
  name: 'Swagger/Wcf'
  active: is_bdo_nl_repository && applications
  is-deferred: true
  actions:
  - type: foreach@1
    enumerable: applications.environments ?? devops_environments
    variable: 'environment'
    actions: 
    - type: folder@1
      name: '{{ environment.name }}'
      is-deferred: true
      actions:
      - type: foreach@1
        enumerable: applications.apps
        variable: application
        actions:
        - type: browser@1
          name: '{{ application.name }}'
          url: '{{ string.replace(application.url, ".bdo.nl", environment.url) }}'
          active: array.size(application.sub) == 0
          profile: BDO
        - type: folder@1
          name: '{{ application.name }}'
          active: array.size(application.sub) > 0
          is-deferred: true
          actions:
          - type: foreach@1
            enumerable: application.sub
            variable: sub
            actions:
            - type: browser@1
              name: '{{ sub.name }}'
              url: '{{ string.replace(application.url, ".bdo.nl", environment.url) }}{{ sub.url }}'
              profile: BDO

- type: folder@1
  name: Analysis
  is-deferred: true
  active: 'is_bdo_nl_repository && (!string.empty(env.WHITESOURCE_PROJECT_ID) || !string.empty(env.SONARCLOUD_PROJECT_ID) || !string.empty(env.APPLICATION_INSIGHTS) )'
  actions:
  # - type: sonarcloud-set-favorite@1
  #   name: Star project in SonarCloud
  #   project: '{{ env.SONARCLOUD_PROJECT_ID }}'
  #   active: '(!string.empty(env.SONARCLOUD_PROJECT_ID) && !sonarcloud.is_favorite(env.SONARCLOUD_PROJECT_ID) )' #todo function sonarcloud.is_favorite
  #   profile: BDO
  - type: browser@1
    name: SonarCloud
    url: https://sonarcloud.io/project/overview?id={{ env.SONARCLOUD_PROJECT_ID }}
    profile: BDO
    active: '!string.empty(env.SONARCLOUD_PROJECT_ID)'    
  - type: browser@1
    name: Whitesource
    url: https://saas-eu.whitesourcesoftware.com/Wss/WSS.html#!project;id={{ env.WHITESOURCE_PROJECT_ID }}
    profile: BDO
    active: '!string.empty(env.WHITESOURCE_PROJECT_ID)'
  - type: browser@1
    name: LogicMonitor
    url: https://bdonl.logicmonitor.com/santaba/uiv3/website/index.jsp#tree/{{ env.LOGICMONITOR_ID }}
    profile: BDO
    active: '!string.empty(env.LOGICMONITOR_ID)'

  - type: folder@1
    name: ApplicationInsights
    is-deferred: true
    active: 'is_bdo_nl_repository && !string.empty(env.RESOURCE_GROUP) && !string.empty(env.APPLICATION_INSIGHTS)'
    actions:
    - type: foreach@1
      enumerable: azure_environments
      variable: environment
      actions:
      - type: browser@1
        name: '{{ environment.name }}'
        url: 'https://portal.azure.com/#@{{ environment.tentant }}/resource/subscriptions/{{ environment.subscription }}/resourceGroups/{{ string.replace(env.RESOURCE_GROUP, "BDONL", environment.resourcegroup_prefix) }}/providers/microsoft.insights/components/{{ string.replace(env.APPLICATION_INSIGHTS, "bdonl", environment.resourcegroup_prefix) }}/overview'
        profile: '{{ environment.browser_profile }}'

- type: foreach@1
  enumerable: azure_items
  variable: azure
  actions:
  - type: folder@1
    name: '{{ azure.name }}'
    # is-deferred: true
    actions:
    - type: foreach@1
      enumerable: azure_environments
      variable: environment
      actions: 
      - type: folder@1
        name: '{{ environment.name }}'
        # is-deferred: true
        context:
        - type: render-variable@1
          name: azure_url_base
          value: 'https://portal.azure.com/#@{{ environment.tentant }}/resource/subscriptions/{{ environment.subscription }}'
        actions:
        - type: foreach@1
          enumerable: azure.value
          variable: az
          iteration-context:
          - type: render-variable@1
            name: azure_url_rg
            value: '{{ azure_url_base }}/resourceGroups/{{ string.replace(az.resourcegroup, "BDONL", environment.resourcegroup_prefix) }}' 
          actions:
          - type: browser@1
            name: '{{ az.name }}'
            url: '{{ az.url }}'
            profile: '{{ environment.browser_profile }}'
            active: 'az.type == "link"'
          
          - type: browser@1
            name: '{{ az.name | object.eval_template }}'
            url: '{{ az.url | object.eval_template }}'
            profile: '{{ environment.browser_profile }}'
            active: '(az.type == "eval-link") && object.eval(az.active)'

          - type: browser@1
            name: '{{ az.name }}'
            url: '{{ azure_url_rg }}/{{ az.section }}'
            profile: '{{ environment.browser_profile }}'
            active: 'string.empty(az.provider) && string.empty(az.url)'
# {{ "This is a template text {{ 1 + 2 }}" | object.eval_template }}
          
          - type: browser@1
            name: '{{ az.name }}'
            url: '{{ azure_url_rg }}/providers/{{ az.provider }}/{{ string.replace(az.resource, "bdonl", environment.resourcegroup_prefix) }}{{ string.replace(az.resource2, "bdonl", environment.resourcegroup_prefix2) }}/{{ az.section }}'
            profile: '{{ environment.browser_profile }}'
            active: '!string.empty(az.provider) && string.empty(az.url)'

